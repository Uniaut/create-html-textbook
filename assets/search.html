<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Keep the "검색 | " prefix; app.js prepends the query to this title. -->
  <title>검색 | TEXTBOOK_TITLE</title>
  <link rel="stylesheet" href="assets/style.css">
  <!-- Order matters: the index must load before app.js. -->
  <script defer src="assets/search-index.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body data-page="search">
  <div class="topbar"><button class="btn" type="button" data-menu-toggle>목차</button></div>
  <div class="layout">
    <!-- SIDEBAR: paste the <aside class="sidebar"> from docs/index.html and remove the
         active link. search.html sits in docs/, so the link paths are the same. -->
    <main class="main">
      <article class="content">
        <h1>검색</h1>
        <p class="meta-bar" id="search-summary">사이드바 검색창에 키워드를 입력하고 Enter를 누르세요. 공백으로 여러 키워드를 구분합니다.</p>
        <div id="search-results"></div>
        <noscript><p>검색은 JavaScript가 켜져 있어야 동작합니다.</p></noscript>
      </article>
    </main>
  </div>
</body>
</html>
