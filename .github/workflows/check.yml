name: Check examples
on: [push, pull_request]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/verify_links.py examples/python-to-cpp/docs
          python3 scripts/verify_links.py examples/value-investing/docs
      - run: node --check assets/app.js
      - name: Search indexes are up to date
        run: |
          python3 scripts/build_search_index.py examples/python-to-cpp/docs
          python3 scripts/build_search_index.py examples/value-investing/docs
          git diff --exit-code -- 'examples/*/docs/assets/search-index.js'
      - run: |
          cmp assets/app.js examples/python-to-cpp/docs/assets/app.js
          cmp assets/style.css examples/python-to-cpp/docs/assets/style.css
          cmp assets/app.js examples/value-investing/docs/assets/app.js
          cmp assets/style.css examples/value-investing/docs/assets/style.css
          c++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only examples/python-to-cpp/lab/grid.cpp
